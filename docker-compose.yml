version: '3.8'

services:
  # MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # go2rtc - NEST to RTSP converter
  go2rtc:
    image: alexxit/go2rtc
    container_name: go2rtc
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/go2rtc.yaml:/config/go2rtc.yaml

  # Frigate NVR
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    shm_size: "256mb"
    depends_on:
      - mosquitto
      - go2rtc
    ports:
      - "5000:5000"
      - "8971:8971"
    environment:
      FRIGATE_RTSP_PASSWORD: "changeme"
    volumes:
      - ./config/frigate.yml:/config/config.yml
      - ./frigate/storage:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    # Uncomment for Google Coral USB
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

  # Prey Detection Service
  prey-detection:
    build:
      context: .
      dockerfile: docker/Dockerfile.prey-detection
    container_name: prey-detection
    restart: unless-stopped
    depends_on:
      - mosquitto
      - frigate
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      FRIGATE_URL: http://frigate:5000
    volumes:
      - ./config/prey_detection_config.yaml:/app/config.yaml
